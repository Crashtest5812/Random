<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="description" content="Play Bank Heist, a choice-based interactive story game.">
  <title>Bank Heist — Random Projects</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      background: #0c0c0c;
      color: #e6e6e6;
      font-size: 14px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at top, #1d251c, #0c0c0c 55%);
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid #9bd47d;
      outline-offset: 3px;
    }
    .terminal {
      display: flex;
      flex-direction: column;
      width: min(100%, 900px);
      min-height: 100vh;
      margin: 0 auto;
      background: #101010;
      border-inline: 1px solid #292929;
    }
    .terminal-header {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid #292929;
      color: #a5a5a5;
      font-size: 12px;
    }
    .terminal-title { color: #dedede; }
    .home-link, .run-again {
      color: #a5a5a5;
      text-decoration: none;
    }
    .home-link:hover, .run-again:hover { color: #fff; }
    .screen {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 38px 28px 48px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #9bd47d;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #f3f3f3;
      font-size: clamp(30px, 7vw, 48px);
      letter-spacing: -0.06em;
    }
    .intro {
      margin: 12px 0 32px;
      color: #aaa;
      line-height: 1.7;
    }
    #output {
      min-height: 100px;
      margin: 0 0 20px;
      color: #dedede;
      font: inherit;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .team-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0;
    }
    .team-input {
      flex: 1 1 250px;
      min-width: 0;
      min-height: 44px;
      border: 1px solid #454545;
      padding: 10px 12px;
      background: #0c0c0c;
      color: #eee;
    }
    .choices {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }
    .choice-heading {
      margin: 0 0 3px;
      color: #aaa;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.6;
    }
    .choice-button, .submit-button, .run-again {
      min-height: 42px;
      border: 1px solid #454545;
      padding: 10px 13px;
      background: #171717;
      color: #e6e6e6;
      text-align: left;
      cursor: pointer;
    }
    .choice-button:hover, .submit-button:hover, .run-again:hover {
      border-color: #9bd47d;
      background: #1d251c;
    }
    .submit-button { border-color: #9bd47d; color: #c9efb6; }
    .run-again { padding: 6px 10px; text-align: center; }
    @media (max-width: 520px) {
      :root { font-size: 13px; }
      .terminal-header { padding-inline: 13px; }
      .screen { padding: 28px 16px 38px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="terminal" aria-label="Bank Heist browser game">
    <header class="terminal-header">
      <a class="home-link" href="./index.html">← Project index</a>
      <span class="terminal-title">Bank Heist</span>
      <button class="run-again" id="run-again" type="button">Start over</button>
    </header>
    <section class="screen" aria-labelledby="page-title">
      <p class="eyebrow">Interactive story · Browser edition</p>
      <h1 id="page-title">Bank Heist</h1>
      <p class="intro">Gather your team, make your choices, and find out how the story ends.</p>
      <pre id="output" aria-live="polite" aria-atomic="false"></pre>
      <form class="team-form" id="team-form">
        <label class="sr-only" for="team-input">Enter your partners' names, separated by commas</label>
        <input class="team-input" id="team-input" type="text" autocomplete="off" placeholder="Partner names, separated by commas">
        <button class="submit-button" type="submit">Continue</button>
      </form>
      <div class="choices" id="choices" aria-label="Game choices"></div>
    </section>
  </main>
  <script>
    const output = document.querySelector("#output");
    const choices = document.querySelector("#choices");
    const teamForm = document.querySelector("#team-form");
    const teamInput = document.querySelector("#team-input");
    const runAgain = document.querySelector("#run-again");

    const plans = {
      cameras: [
        "Use a jammer to disable the cameras.",
        "Use bricks to break the cameras.",
        "Use a gun to break the cameras.",
      ],
      guards: [
        "Use a smoke bomb to distract the guards.",
        "Use a gun to take out the guards.",
        "Use a taser to disable the guards.",
        "Fake an emergency to lure the guards away.",
      ],
      backDoor: [
        "Use a crowbar to pry open the door.",
        "Look for the keycard to open the door.",
        "Use a keypad combination cracker to open the door.",
        "Dewire the door lock to open the door.",
      ],
      vault: [
        "Use a drill to break into the vault.",
        "Use a key to open the vault.",
        "Use a bomb to blow up the vault.",
      ],
      containers: [
        { text: "Use duffel bags to carry the money.", amount: "$100,000", name: "duffel bags" },
        { text: "Use a potato sack to carry the money.", amount: "$10,000", name: "a potato sack" },
        { text: "Use a cart to carry the money.", amount: "$50,000", name: "a cart" },
        { text: "Use a backpack to carry the money.", amount: "$25,000", name: "a backpack" },
      ],
      cars: ["Honda Sedan", "Bank Van", "Ford Mustang", "Chevrolet Camaro"],
      roof: [
        "Use a drone to scout the roof access point.",
        "Cut through the maintenance tunnel.",
        "Use an elevator access keycard.",
      ],
    };

    let partnerNames = [];
    let jeffOnTeam = false;
    let plan = {};

    function print(text = "") {
      output.append(document.createTextNode(`${text}\n`));
      output.scrollIntoView({ block: "end" });
    }

    function clearChoices() {
      choices.replaceChildren();
    }

    function showChoices(title, options, onChoose) {
      clearChoices();
      const heading = document.createElement("h2");
      heading.className = "choice-heading";
      heading.textContent = title;
      choices.append(heading);

      for (const option of options) {
        const button = document.createElement("button");
        button.className = "choice-button";
        button.type = "button";
        button.textContent = option.label;
        button.addEventListener("click", () => {
          clearChoices();
          print(`> ${option.label}`);
          onChoose(option.value);
        });
        choices.append(button);
      }

      choices.querySelector("button")?.focus();
    }

    function chooseFromList(title, options, onChoose) {
      showChoices(title, options.map((value) => ({ label: value, value })), onChoose);
    }

    function startEntranceSelection() {
      print(`You have chosen ${partnerNames.length ? partnerNames.join(", ") : "no one"} as your partners.`);
      print("Now, let's plan the heist.");
      chooseFromList("Choose your entrance:", ["front", "back", "roof"], (entrance) => {
        plan.entrance = entrance;
        print(`You chose the ${entrance} entrance.`);
        chooseFromList("Choose your camera plan:", plans.cameras, (camera) => {
          plan.camera = camera;

          if (entrance === "front") {
            chooseFromList("Choose your plan for the guards:", plans.guards, (guard) => {
              plan.guard = guard;
              chooseVault();
            });
          } else if (entrance === "back") {
            chooseFromList("Choose your plan for the back door:", plans.backDoor, (door) => {
              plan.door = door;
              chooseVault();
            });
          } else {
            chooseFromList("Choose your roof entry plan:", plans.roof, (roof) => {
              plan.roof = roof;
              chooseVault();
            });
          }
        });
      });
    }

    function chooseVault() {
      chooseFromList("Choose your plan for the vault:", plans.vault, (vault) => {
        plan.vault = vault;
        chooseFromList("Choose how to carry the money:", plans.containers.map((item) => item.text), (container) => {
          plan.container = plans.containers.find((item) => item.text === container);
          chooseFromList("Choose your getaway car:", plans.cars, (car) => {
            plan.car = car;
            finishHeist();
          });
        });
      });
    }

    function finishHeist() {
      print("");
      print("Now, let's execute the heist.");
      print("");

      if (plan.entrance === "front") {
        print(`You enter through the front entrance and use this camera plan: ${plan.camera}`);
        print(`You use this guard plan: ${plan.guard}`);
      } else if (plan.entrance === "back") {
        print(`You enter through the back entrance and use this camera plan: ${plan.camera}`);
        print(`You open the back door with this plan: ${plan.door}`);
      } else {
        print(`You approach the roof and use this entry plan: ${plan.roof}`);
        print(`You use this camera plan: ${plan.camera}`);
      }

      print(`You open the vault with this plan: ${plan.vault}`);

      if (jeffOnTeam) {
        if (plan.entrance === "roof") {
          print("Jeff was supposed to help you carry the money off the roof, but he lost his footing and dropped the duffel bags.");
          print("The guards were alerted and caught your team before you could escape.");
          print("Jeff was a liability during the heist, and got you caught.");
          print("The heist has failed. You have lost the money and your freedom.");
        } else {
          print("Jeff trips and drops the bags. The guards catch your team, while the driver escapes.");
          print("The heist has failed. You have lost the money and your freedom.");
        }
        const years = Math.floor(Math.random() * 16) + 5;
        print(`You were sent to prison for ${years} years.`);
        print("Game over.");
      } else {
        print(`You carry the money using ${plan.container.name} and escape in the ${plan.car}.`);
        print("You and your team have successfully completed the heist!");
        print(`You stole ${plan.container.amount} in cash using ${plan.container.name}.`);
      }

      clearChoices();
      teamForm.hidden = true;
      runAgain.focus();
    }

    function start() {
      output.textContent = "";
      plan = {};
      partnerNames = [];
      jeffOnTeam = false;
      teamForm.hidden = false;
      teamInput.value = "";
      clearChoices();
      print("Recruits!");
      print("You are assigned Bank Heist.");
      print("You will need to gather a team, plan the heist, and execute it flawlessly.");
      print("");
      teamInput.focus();
    }

    teamForm.addEventListener("submit", (event) => {
      event.preventDefault();
      partnerNames = teamInput.value.split(",").map((name) => name.trim()).filter(Boolean);
      jeffOnTeam = partnerNames.some((name) => name.toLowerCase() === "jeff");
      teamForm.hidden = true;

      if (jeffOnTeam) {
        print("Really? You want Jeff? He is obnoxious and will likely get you caught.");
        showChoices("Keep Jeff on your team?", [
          { label: "Yes, keep Jeff", value: true },
          { label: "No, remove Jeff", value: false },
        ], (keepJeff) => {
          if (!keepJeff) {
            partnerNames = partnerNames.filter((name) => name.toLowerCase() !== "jeff");
            jeffOnTeam = false;
            print("Jeff has been removed from your roster.");
          } else {
            print("You have chosen to keep Jeff on your team. Good luck.");
          }
          startEntranceSelection();
        });
      } else {
        print("Jeff is not on your team. Good choice.");
        startEntranceSelection();
      }
    });

    runAgain.addEventListener("click", start);
    start();
  </script>
</body>
</html>
