name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p "_site/Site Pages" _site/SB
          cp index.html _site/
          cp "Site Pages/"*.html "_site/Site Pages/"
          cp "Site Pages/"*.js "_site/Site Pages/"
          cp SB/supabase-config.js _site/SB/
          mkdir -p _site/assets
          cp assets/*.mp3 _site/assets/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
